---
- name: "Update Pacman Cache"
  community.general.pacman:
    update_cache: true
  register: pacman_cache_update
  until: pacman_cache_update is succeeded
  retries: 10
  delay: 30
  changed_when: false

- name: "Update all Pacman packages"
  community.general.pacman:
    upgrade: true
    upgrade_extra_args: >-
      --noconfirm --needed
      {% if package_exclude | length > 0 %}--ignore {{ package_exclude | join(',') }}{% endif %}
  register: pacman_results

- name: "Update all AUR packages"
  become: true
  become_user: "{{ ansible_user }}"
  community.general.pacman:
    upgrade: true
    executable: "{{ aur_helper }}"
    upgrade_extra_args: >-
      --noconfirm --needed
      {% if package_exclude | length > 0 %}--ignore {{ package_exclude | join(',') }}{% endif %}
  register: aur_results

- name: "Notify Discord of patch status"
  ansible.builtin.include_tasks: notify_patch_status.yml
  vars:
    patched: "{{ pacman_results.changed or aur_results.changed }}"

- name: Check if a Reboot is Required
  ansible.builtin.command: needrestart -b
  register: reboot_required
  changed_when: false

- name: "Determine reboot need"
  # needrestart -b prints a machine-readable NEEDRESTART-KSTA line (kernel
  # status): 0 unknown, 1 current, 2 ABI-compatible upgrade pending, 3 version
  # upgrade pending. A reboot is warranted for >= 2. This replaces locale- and
  # version-fragile English stdout string matching.
  ansible.builtin.set_fact:
    reboot_required_bool: >-
      {{ (reboot_required.stdout_lines
          | select('match', '^NEEDRESTART-KSTA:')
          | map('regex_replace', '^NEEDRESTART-KSTA:\\s*', '')
          | map('int') | first | default(0) | int) >= 2 }}
    reboot_skip: "{{ inventory_hostname in groups['devices_net'] }}"
