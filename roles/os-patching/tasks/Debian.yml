---
- name: "Hold excluded packages from being upgraded"
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ package_exclude }}"
  when: package_exclude | length > 0

- name: "Update APT Cache"
  ansible.builtin.apt:
    update_cache: true
  register: apt_cache_update
  until: apt_cache_update is succeeded
  retries: 10
  delay: 30
  changed_when: false

- name: "Update all APT packages"
  ansible.builtin.apt:
    upgrade: full
    autoremove: true
    autoclean: true
  register: apt_results

- name: "Notify Discord of patch status"
  ansible.builtin.include_tasks: notify_patch_status.yml
  vars:
    patched: "{{ apt_results.changed }}"

- name: Check if a Reboot is Required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: "Determine reboot need"
  ansible.builtin.set_fact:
    reboot_required_bool: "{{ reboot_required.stat.exists }}"
