---
- name: "Update DNF Cache"
  ansible.builtin.dnf:
    update_cache: true
  register: dnf_cache_update
  until: dnf_cache_update is succeeded
  retries: 10
  delay: 30
  changed_when: false

- name: "Update all DNF packages"
  ansible.builtin.dnf:
    name: "*"
    state: latest
    exclude: "{{ package_exclude }}"
  register: dnf_results

- name: "Cleanup DNF cache"
  ansible.builtin.dnf:
    autoremove: true

- name: "Notify Discord of patch status"
  ansible.builtin.include_tasks: notify_patch_status.yml
  vars:
    patched: "{{ dnf_results.changed }}"

- name: Check if a Reboot is Required
  ansible.builtin.command: /usr/bin/needs-restarting -r
  register: reboot_required
  changed_when: reboot_required.rc == 1
  failed_when:
    - not reboot_required.rc == 0
    - not reboot_required.rc == 1

- name: "Determine reboot need"
  ansible.builtin.set_fact:
    reboot_required_bool: "{{ reboot_required.rc == 1 }}"
